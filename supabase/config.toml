
# Public KYC form endpoint. verify_jwt = false because the callers are clients
# with a link and no account; the function authenticates them by token instead.
[functions.kyc-form]
enabled = true
verify_jwt = false
import_map = "./functions/kyc-form/deno.json"
entrypoint = "./functions/kyc-form/index.ts"

[functions.notify-new-prospect]
enabled = true
verify_jwt = false
import_map = "./functions/notify-new-prospect/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/notify-new-prospect/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/notify-new-prospect/*.html" ]
